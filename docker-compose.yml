version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: asterion-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    networks:
      - asterion-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asterion-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: asterion
      MONGO_PASSWORD: asterionpass
      MONGO_DB: asterion
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - asterion-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asterion-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - asterion-network

volumes:
  mongodb_data:
    driver: local

networks:
  asterion-network:
    driver: bridge