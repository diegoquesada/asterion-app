version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: asterion-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - mongodb/mongodb.env
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - asterion-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asterion-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - backend/backend.env
    depends_on:
      - mongodb
    networks:
      - asterion-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asterion-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - asterion-network

volumes:
  mongodb_data:
    driver: local

networks:
  asterion-network:
    driver: bridge
